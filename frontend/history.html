<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 기록 — 타로냥</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="타로냥">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
</head>
<body class="bg-navy text-gray-100 font-sans min-h-screen">

    <a href="#main-content" class="skip-nav">본문으로 건너뛰기</a>
    <nav class="fixed top-0 w-full z-50 bg-navy/80 backdrop-blur-md border-b border-lavender/20">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-serif font-bold text-lavender">🔮 타로냥</a>
            <div class="flex items-center gap-4 text-sm">
                <a href="/tarot" class="hover:text-lavender transition">타로 상담</a>
                <span class="text-lavender">상담 기록</span>
            </div>
        </div>
    </nav>

    <main id="main-content" class="pt-20 pb-10 px-4 max-w-2xl mx-auto">
        <h1 class="font-serif text-2xl text-lavender mb-6">📜 상담 기록</h1>

        <!-- 로그인 필요 -->
        <div id="need-login" class="hidden text-center py-16">
            <div class="text-4xl mb-4">🔒</div>
            <p class="text-gray-400 mb-4">상담 기록을 보려면 로그인해주세요</p>
            <a href="/login?redirect=/history" class="inline-block bg-gradient-to-r from-purple-700 to-lavender text-white px-6 py-3 rounded-full font-bold">로그인하기</a>
        </div>

        <!-- 기록 목록 -->
        <div id="readings-list" class="space-y-4"></div>

        <!-- 빈 상태 -->
        <div id="empty-state" class="hidden text-center py-16">
            <div class="text-4xl mb-4">📋</div>
            <p class="text-gray-400 mb-4">아직 상담 기록이 없어요</p>
            <a href="/tarot" class="inline-block bg-gradient-to-r from-purple-700 to-lavender text-white px-6 py-3 rounded-full font-bold">첫 상담하기 🃏</a>
        </div>
    </main>

    <script>
        function escapeHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function loadReadings() {
            if (!localStorage.getItem('user')) {
                document.getElementById('need-login').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/readings');
                if (!res.ok) {
                    if (res.status === 401) {
                        localStorage.removeItem('user');
                        document.getElementById('need-login').classList.remove('hidden');
                    } else {
                        document.getElementById('empty-state').classList.remove('hidden');
                    }
                    return;
                }
                const readings = await res.json();
                if (!readings.length) {
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                const catLabels = { love: '연애', money: '재물', career: '진로', general: '종합', newyear: '신년운', compatibility: '궁합' };
                const catEmoji = { love: '💕', money: '💰', career: '💼', general: '🌟', newyear: '🎊', compatibility: '💑' };
                const list = document.getElementById('readings-list');
                list.innerHTML = readings.map(r => `
                    <div class="bg-dark-purple/60 border border-lavender/15 rounded-2xl p-5">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-lg">${catEmoji[r.category] || '🌟'} ${escapeHtml(catLabels[r.category] || r.category)}</span>
                            <span class="text-xs text-gray-500">${r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR') : ''}</span>
                        </div>
                        ${r.question ? `<p class="text-sm text-gray-400 mb-2">Q: ${escapeHtml(r.question)}</p>` : ''}
                        <p class="text-sm text-gray-200 line-clamp-3">${escapeHtml((r.interpretation || '').substring(0, 150))}...</p>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('empty-state').classList.remove('hidden');
            }
        }

        loadReadings();
    </script>

    <script src="/static/js/config.js"></script>
    <script src="/static/js/analytics.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
