name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    # ZEMA-3811: Daily Fortune auto-publish PRs are opened by GITHUB_TOKEN
    # (github-actions[bot]) and merged within seconds. GitHub creates CI runs
    # for such bot-opened PRs in an approval-required state that no one can
    # approve in time, so they finalize as 0-job workflow failures (daily red X).
    # These PRs only touch generated files, so skip them. Human PRs touching
    # any source file still run CI normally.
    paths-ignore:
      - 'frontend/blog/daily/**'
      - 'frontend/rss.xml'
      - 'frontend/sitemap.xml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          JEST_JUNIT_OUTPUT_DIR: reports/junit
          JEST_JUNIT_OUTPUT_NAME: test-results.xml
          # llm.test.ts requires a non-empty ZAI_API_KEY (config guard).
          # All fetch calls are mocked in tests, so a dummy key is safe
          # and never reaches the real API.
          ZAI_API_KEY: ci-test-dummy-key
        run: npx jest --ci --coverage --reporters=default --reporters=jest-junit

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: backend/reports/junit/*.xml
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint src/ --ext .ts

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML
        run: |
          for f in *.html admin/*.html; do
            if [ -f "$f" ]; then
              echo "✅ $f exists"
            fi
          done

      - name: Check CSS
        run: |
          if [ -f css/style.css ]; then
            echo "✅ CSS OK"
          else
            echo "❌ Missing CSS"
            exit 1
          fi

      - name: Check JS
        run: |
          for f in js/*.js; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            fi
          done
